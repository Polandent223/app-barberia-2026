name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm install
      - run: npm run check:syntax
      - run: npm run lint
      - name: Smoke test
        run: |
          npm i -D puppeteer
          npm run smoke
